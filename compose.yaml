# Docker's default json-file log driver has no size limit: container output
# grows in /var/lib/docker/containers until the disk does. Every service here
# caps it explicitly rather than relying on a daemon-wide default that may or
# may not be configured on the host.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:8-alpine
    volumes:
      - redis:/data
    ports:
      - "6379:6379"
    logging: *logging

volumes:
  redis:
