# The Yandex Wiki API drifts: the undocumented search endpoint silently swapped its
# wire contract between 2026-07 and 2026-08 (see docs/api-notes.md). This workflow
# re-runs the live contract sweep on a schedule so drift shows up as a red run
# instead of a broken tool in production.
#
# Opt-in: configure all of these as repository *secrets*, not variables
#   DRIFT_WIKI_TOKEN        — OAuth token of a dedicated/robot account
#   DRIFT_SWEEP_SLUG        — scratch slug the sweep may create/delete pages
#                             under, e.g. users/robot/contract-sweep
#   DRIFT_WIKI_ORG_ID       — exactly one of the two org ids
#   DRIFT_WIKI_CLOUD_ORG_ID
# Without them every step is skipped and the run stays green.
#
# Secrets rather than variables even for the non-credentials: on a public repo
# the Actions logs are public, and only secrets are masked. The sweep prints
# the slug it works under ("=== fixtures under '<slug>' ===", one "deleted
# <slug>/..." line per page during cleanup), which would otherwise publish the
# account name and the section layout every week.

name: API drift check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-sweep:
    runs-on: ubuntu-latest
    env:
      WIKI_TOKEN: ${{ secrets.DRIFT_WIKI_TOKEN }}
      WIKI_ORG_ID: ${{ secrets.DRIFT_WIKI_ORG_ID }}
      WIKI_CLOUD_ORG_ID: ${{ secrets.DRIFT_WIKI_CLOUD_ORG_ID }}
      SWEEP_SLUG: ${{ secrets.DRIFT_SWEEP_SLUG }}
    steps:
      - name: Check drift credentials are configured
        id: creds
        run: |
          # An unset secret arrives as the empty string, so a partial setup
          # would otherwise pass this gate and die on the first API call
          # with a bare traceback.
          if [ -n "$WIKI_TOKEN" ] && [ -n "$SWEEP_SLUG" ] &&
             { [ -n "$WIKI_ORG_ID" ] || [ -n "$WIKI_CLOUD_ORG_ID" ]; }; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Drift credentials are incomplete — need DRIFT_WIKI_TOKEN, DRIFT_SWEEP_SLUG"
            echo "and one of DRIFT_WIKI_ORG_ID / DRIFT_WIKI_CLOUD_ORG_ID. Skipping the sweep."
          fi

      - name: Checkout code
        if: steps.creds.outputs.present == 'true'
        uses: actions/checkout@v5

      - name: Install uv
        if: steps.creds.outputs.present == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          cache-suffix: drift

      - name: Install dependencies
        if: steps.creds.outputs.present == 'true'
        run: uv sync

      - name: Run the live contract sweep
        if: steps.creds.outputs.present == 'true'
        run: uv run python scripts/contract_sweep.py "$SWEEP_SLUG"

      - name: Clean up sweep fixtures
        if: always() && steps.creds.outputs.present == 'true'
        run: uv run python scripts/contract_sweep.py "$SWEEP_SLUG" --cleanup
