name: Release MCP Server

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  validate-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate package metadata versions
        shell: bash
        run: python scripts/check_versions.py --tag "$GITHUB_REF"

  build-python:
    needs: validate-metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install build dependencies
        run: uv sync --dev

      - name: Build package
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          retention-days: 7

  build-mcpb:
    needs: validate-metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Prepare NodeJS
        uses: actions/setup-node@v6

      - name: Install mcpb CLI
        run: |
          npm install -g @anthropic-ai/mcpb

      - name: Create mcpb package
        run: |
          mcpb validate manifest.json
          mcpb pack . yandex-wiki-search-mcp-${{ github.ref_name }}.mcpb

      - name: Upload mcpb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcpb
          path: "*.mcpb"
          retention-days: 7

  build-docker:
    needs: validate-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/yandex-wiki-search-mcp
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs:
      - build-python
      - build-mcpb
      - build-docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/yandex-wiki-search-mcp
    permissions:
      id-token: write  # Required for trusted publishing
      contents: write  # Required for releases

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        print-hash: true
        verbose: true
        skip-existing: true

    - name: Download mcpb artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: "mcpb*"
        path: mcpb/
        merge-multiple: true

    - name: Make GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        generate_release_notes: true
        files: |
          dist/*
          mcpb/*

    - name: Checkout code for server.json
      uses: actions/checkout@v5

    - name: Install mcp-publisher
      run: |
        curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

    - name: Authenticate to MCP Registry
      run: ./mcp-publisher login github-oidc

    # Optional:
    # - name: Set version in server.json
    #   run: |
    #     VERSION=${GITHUB_REF#refs/tags/v}
    #     jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json

    - name: Publish server to MCP Registry
      run: ./mcp-publisher publish
