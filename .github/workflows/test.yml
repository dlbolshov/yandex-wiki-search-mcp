name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Check version consistency across release metadata
      run: python scripts/check_versions.py

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        cache-suffix: lint

    - name: Install dependencies
      run: uv sync --dev

    - name: Run ruff check
      run: uv run ruff check .

    - name: Run ruff format check
      run: uv run ruff format --check .

    - name: Run ty
      run: uv run ty check .

    - name: Run mypy
      run: uv run mypy .

  install:
    # Everything else installs from uv.lock, so the version ranges in
    # pyproject.toml are never exercised and a dependency's breaking major
    # release reaches users before it reaches CI. This job resolves them
    # fresh from the built wheel, the way `uvx` and `pip install` do.
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.13"

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        cache-suffix: install

    - name: Build the wheel
      run: uv build

    - name: Install it, resolving dependencies from scratch
      run: |
        uv venv /tmp/smoke
        uv pip install --python /tmp/smoke/bin/python dist/*.whl

    - name: Report what the ranges actually resolved to
      run: /tmp/smoke/bin/python -m pip list 2>/dev/null || uv pip list --python /tmp/smoke/bin/python

    - name: Build the server and count its tools
      env:
        WIKI_TOKEN: dummy-token
        WIKI_ORG_ID: "1"
      run: |
        /tmp/smoke/bin/python - <<'PY'
        import asyncio
        import json
        import pathlib

        from mcp_wiki.mcp.server import create_mcp_server
        from mcp_wiki.settings import Settings

        # The expected count comes from manifest.json — the manifest is pinned
        # to the registered surface by the test suite, so hardcoding a number
        # here would only add a copy that rots (as 27 did when M7 landed).
        expected = len(json.loads(pathlib.Path("manifest.json").read_text())["tools"])
        server = create_mcp_server(Settings())
        tools = asyncio.run(server.list_tools())
        print(f"{len(tools)} tools registered")
        assert len(tools) == expected, f"expected {expected} tools, got {len(tools)}"
        PY

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: ["3.11", "3.12", "3.13"]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      run: uv sync --dev

    - name: Run tests
      run: uv run pytest --cov=mcp_wiki --cov-branch --cov-report=xml .

    # Gated on one leg on purpose. A handful of tests skip on Windows (mode
    # bits, fchmod, fsyncing a directory descriptor) and so do the arms they
    # cover, so a 100% gate on every cell can only be met by excluding those
    # arms from measurement everywhere — which is how the directory fsync
    # lost its last regression detector. Windows and macOS still run every
    # test they can; ubuntu keeps the line where the code is fully reachable.
    - name: Enforce coverage
      if: matrix.os == 'ubuntu-latest'
      run: uv run coverage report --fail-under=100

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml
